interface:
  display_name: "Agent Director"
  short_description: "Apply contract-first Director mode to Codex repository work"
  default_prompt: >-
    Apply Agent Director by default to this repository task. The root/current
    parent session is the only Director; a spawned subagent is never a Director
    under any circumstance. Spawned workers/reviewers remain in their assigned
    roles, which are non-Director roles that the parent assigns before
    creation; the role name director is invalid. The parent Director's Task
    Contract is authoritative:
    execute only the assigned mission and report evidence/status. Do not
    announce director_mode: on, publish root-level task_start/composition
    disclosures, rewrite or re-decompose the parent contract, spawn/manage
    workers, integrate/merge, or declare overall completion. If the role or
    contract is unavailable or contradictory, stop and report role ambiguity to
    the parent; a parent-contracted deployment or other external/state-changing
    operation remains allowed. Explicitly dispatch every native worker as
    gpt-5.6-luna with reasoning_effort=max, verify returned metadata, and
    delegate only through written contracts. Before every worker spawn, the
    root/current parent Director must assign an explicit role name and a
    per-worker contract containing scope/non-goals and the exact worker fields
    goal, success_criteria, failure_criteria, termination_criteria, and
    required_evidence. Overall objective, completion_criteria, or generic
    error_handling do not substitute for these fields. Missing, ambiguous, or
    director role assignment, or any required field, is a pre-spawn failure;
    do not create the worker.
policy:
  allow_implicit_invocation: true
