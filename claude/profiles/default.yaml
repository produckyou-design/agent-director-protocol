# Model names are environment aliases the user may freely change; the protocol never depends on a specific model name.
#
# ONE default profile, not one per director model. The director is always
# whoever is running this session right now — if you switch models mid-project
# with /model, the director switches with you live; there is no file to update
# for that. This profile does not select who the director is. It sets
# operational policy that should hold steady regardless of which model is
# currently in the director seat: how large a subagent batch can get before it
# needs your approval, how many implementer failures trigger Rescue Protocol
# classification, and what reasoning effort the implementer gets per task
# kind. Copy this file and edit it (or point CLAUDE.md at your copy) only when
# a project wants different policy values — not to "pick a director model."
director:
  preferred_models: [opus-5, fable-5]  # recommended tiers for this role, not a selection you must make
  effort: high        # optional hint; adapters map to platform mechanism or omit
  # Above this many subagents in one disclosed batch (DELEGATION-PROTOCOL.md
  # step 7), the agent-composition disclosure also becomes an approval
  # request — dispatch waits for the user to grant it. This is a volume
  # control independent of the conflict-domain check in
  # core/CONCURRENCY-RULES.md, which only checks safety, not size. Lower it
  # if you want to review every batch above e.g. 2; raise it if you trust
  # larger disclosed batches in this project.
  max_batch_agents: 4
implementer:
  # Measure cost per completed task, not per token. A cheaper-per-token model
  # that needs more steps, more retries, and more supervision can cost more to
  # finish the same work — and the per-token gap is usually smaller than the
  # sticker suggests once an introductory rate expires. Pick the tier whose
  # total cost to *done* is lowest for your workload, then verify on your own
  # tasks rather than trusting anyone's benchmark (including this comment).
  preferred_models: [opus-5, sonnet-5]
  # Per-task-kind reasoning effort. The director MUST pass the matching value
  # on every spawn; omitting it silently inherits the session default, which
  # under-powers investigation work and over-powers mechanical work.
  #
  # These sit one notch lower than you might expect because a capable model at
  # a modest effort tier is often the efficient point: it spends a fraction of
  # the tokens and latency while holding quality, and effort defaults carried
  # over from an older model rarely transfer. Sweep your own tasks before
  # changing them — and note that raising effort *up front* on agentic work
  # sometimes lowers total cost by cutting the number of turns.
  effort_by_task_kind:
    investigation: high   # root-cause hunts, competing hypotheses, design judgement
    audit: high           # pre-release compliance / security review
    implementation: medium
    pipeline: medium      # release/deploy execution — procedure fidelity, not creativity
    mechanical: low       # version bumps, doc sync, single-line edits
  effort_default: medium
  # How many counted failed loops (FAILURE-LOOP.md) on the same task before
  # RESCUE-PROTOCOL.md classification kicks in. Default 2; raise it only if
  # an extra implementer attempt is genuinely cheap here, lower it never
  # below 1. See core/RESCUE-PROTOCOL.md "The default flow".
  failure_threshold: 2
reviewer:
  inherit: director   # default: reviewer == director
