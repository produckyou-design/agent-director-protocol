# Model names are environment aliases the user may freely change; the protocol never depends on a specific model name.
#
# ONE default profile, not one per director model. The director is always
# whoever is running this session right now — if you switch models mid-project
# with /model, the director switches with you live; there is no file to update
# for that. This profile does not select who the director is. It sets
# operational policy that should hold steady regardless of which model is
# currently in the director seat: adapter model/effort rules and how many
# implementer failures trigger Rescue Protocol classification. Native runtime
# capacity is observed by the adapter, not invented by this policy metadata.
# Copy this file and edit it (or point CLAUDE.md at your copy) only when a
# project wants different policy values — not to "pick a director model."
director:
  preferred_models: [opus-5, fable-5]  # recommended tiers for this role, not a selection you must make
  effort: high        # optional hint; adapters map to platform mechanism or omit
implementer:
  # ONE tier, deliberately. Nothing in the protocol picks between entries:
  # a Rescue Agent only ever raises reasoning effort, and a model change is a
  # user decision (see core/RESCUE-PROTOCOL.md). A list of two would leave a
  # director guessing which to use for which task, with no rule to consult.
  # To run cheaper, swap this alias wholesale — do not add a second entry
  # hoping the director will choose per task; it will not.
  #
  # Why the higher tier is the default: measure cost per completed task, not
  # per token. A cheaper-per-token model that needs more steps, more retries,
  # and more supervision can cost more to finish the same work — and the
  # per-token gap is usually smaller than the sticker suggests once an
  # introductory rate expires. Verify on your own tasks rather than trusting
  # anyone's benchmark (including this comment).
  preferred_models: [opus-5]
  # Per-task-kind reasoning effort. The director MUST pass the matching value
  # on every spawn; omitting it silently inherits the session default, which
  # under-powers investigation work and over-powers mechanical work.
  #
  # These sit one notch lower than you might expect for two reasons. First, a
  # capable model at a modest effort tier is often the efficient point: it
  # spends a fraction of the tokens and latency while holding quality, and
  # effort defaults carried over from an older model rarely transfer. Second,
  # effort is the *only* lever a Rescue Agent pulls when a task gets stuck —
  # it climbs this ladder on the same model and never swaps the model itself
  # (see core/RESCUE-PROTOCOL.md). Starting at the top tier leaves no ladder
  # to climb. Sweep your own tasks before changing them — and note that
  # raising effort *up front* on agentic work sometimes lowers total cost by
  # cutting the number of turns.
  effort_by_task_kind:
    investigation: high   # root-cause hunts, competing hypotheses, design judgement
    audit: high           # pre-release compliance / security review
    implementation: medium
    pipeline: medium      # release/deploy execution — procedure fidelity, not creativity
    # mechanical: the contract fully determines the change AND a command
    # verifies it. If the implementer has to *decide* anything, it is not
    # mechanical — classify it as implementation. Effort matters least here
    # (precise instruction-following, not reasoning), and starting at `low`
    # leaves the most room to climb. A "mechanical" task that needs high
    # effort is a misclassification signal, not a reason to raise the default.
    mechanical: low
  effort_default: medium
  # How many counted failed loops (FAILURE-LOOP.md) on the same task before
  # RESCUE-PROTOCOL.md classification kicks in. Default 2; raise it only if
  # an extra implementer attempt is genuinely cheap here, lower it never
  # below 1. See core/RESCUE-PROTOCOL.md "The default flow".
  failure_threshold: 2
reviewer:
  # Reviewing an implementer's output is already independent: a different
  # agent, a different context. The director does that directly.
  inherit: director
  # But the director must never review an artifact it produced itself — that
  # is self-review, and "be extra rigorous" is not a control. When the
  # director authored the diff (takeover), spawn a SEPARATE reviewer at the
  # director's own model and effort, with a fresh context. Same rigor, no
  # inherited blind spots. See core/REVIEW-GATES.md.
  independent_for_director_authored_work: true
