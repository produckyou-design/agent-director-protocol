# Model names below are environment aliases — users may point "sol" (or any
# other name here) at whatever Codex model their config.toml resolves it to.
# This file is a platform-neutral description of intent, not a literal Codex
# config.toml; map it onto your own config.toml / profile file as described in
# ../INSTALL.md.
director:
  preferred_models: [sol]
  effort: high        # maps to Codex's model_reasoning_effort; use xhigh for heavy design/decomposition passes
  # Above this many codex exec workers in one disclosed batch
  # (core/DELEGATION-PROTOCOL.md step 7), the agent-composition disclosure
  # also becomes an approval request — dispatch waits for the user to grant
  # it. This is a volume control independent of the conflict-domain check in
  # core/CONCURRENCY-RULES.md, which only checks safety, not size. Each
  # codex exec run is a separate OS process, so going over budget here is
  # also a real resource cost, not just a review-fatigue concern.
  max_batch_agents: 4
implementer:
  # Measure cost per completed task, not per token. A cheaper-per-token model
  # that needs more steps, more retries, and more supervision can cost more to
  # finish the same work. Pick the tier whose total cost to *done* is lowest
  # for your workload, and verify on your own tasks.
  preferred_models: [configured-subagent-model]
  # Per-task-kind reasoning effort (maps to model_reasoning_effort per codex
  # exec run). The director MUST pass the matching value on every worker
  # invocation; omitting it silently inherits the session default, which
  # under-powers investigation work and over-powers mechanical work.
  #
  # Effort is the *only* lever a Rescue Agent pulls — it climbs this ladder on
  # the worker's existing model and never swaps the model itself (see
  # core/RESCUE-PROTOCOL.md "The Rescue Agent raises reasoning effort, not the
  # model"). So leave headroom above the default: starting at the top tier
  # means there is no ladder to climb when a task gets stuck. Sweep these on
  # your own tasks; effort defaults carried over from an older model rarely
  # transfer unchanged.
  effort_by_task_kind:
    investigation: high   # root-cause hunts, competing hypotheses, design judgement
    audit: high           # pre-release compliance / security review
    implementation: medium
    pipeline: medium      # release/deploy execution — procedure fidelity, not creativity
    mechanical: low       # version bumps, doc sync, single-line edits
  effort_default: medium
  # How many counted failed loops (core/FAILURE-LOOP.md) on the same task
  # before core/RESCUE-PROTOCOL.md classification kicks in. Default is 2;
  # raised here to 3 because a codex exec worker run is cheap and fast
  # enough that one extra guess-attempt (still evidence-based, never a
  # blind retry) costs little before promoting to a Rescue Agent. Tune
  # anywhere from 2-4; never below 1. See core/RESCUE-PROTOCOL.md
  # "The default flow".
  failure_threshold: 3
reviewer:
  inherit: director   # default: reviewer == director (see core/ROLE-CONTRACT.md)
